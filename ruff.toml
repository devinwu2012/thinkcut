# Python 检查（ruff）：uvx ruff@0.17.6 check .
# 2026-11-25 起只查“真错误”：语法错、用了没定义的名字、比较写错这类，全仓库现在 0 处，新改动也要保持 0。
# 风格类（行太长、没用的导入等）先不查：老代码不批量重排，免得和并行分支冲突；新写的文件尽量一行不超过 120 字。
target-version = "py39"
line-length = 120
extend-exclude = ["素材库", "环境", "build", "**/*.min.js"]

[lint]
select = ["E9", "F63", "F7", "F82"]
