<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ThinkCut</title>
<!--THINKCUT_TOKENS-->
<style>
/* 首页（2026-11-24 用户定方向 C：“像网页、丑、不合理、片子删不掉”→ 四步看板，每条片子开成自己的窗口）。thinkcut_edit.py home 起的服务给它（固定端口 8760）。
   规矩：
   1. 状态只有 4 个词、同一套颜色：待你看（蓝）／待发送（橙）／AI 在改（紫）／✓ 已定（绿）；没事做的不挂标签。四步：写文案 → 出初稿 → 改初稿 → 发布。
   2. 外观按 Mac 原生：系统字体，浅色为主、跟系统深浅色走，工具栏 52 高；主按钮“＋ 新建片子”在工具栏最右。
   3. 看板／列表两种看法，记住上次选的（只存在这台电脑的浏览器里）。
   4. 右键一条片子（看板的卡、列表的行都一样）：打开、在访达中显示、重命名…、移到“做完的”／移回来、复制片名、移到回收站…。
   5. 小浮层（“新建片子”“AI 在等吗”、右键菜单）点外面空白处关、Esc 关；确认框（改名、删除）是 Mac 式从工具栏下面落下的，点外面不关，只能点按钮或 Esc。
   6. 删除＝整个片子文件夹挪进 NAS 回收站（能还原，不是永久删除），先弹确认框；挪完底下提示条可以“撤销”。
   7. 只开一条片子（C2，用户 2026-11-24 定；达芬奇一次只开一个工程）：单击只选中，双击（或回车、右键“打开”）就在这个窗口里进到这条片子
      （location.href＝审片台网址?home=首页地址#栏目），在片子里按 ⌘W（外壳）或浏览器后退回到这里；上次开的那张卡描蓝边、标“上次开的”。
      审片台还没起时先到首页的 /open?…，首页起好审片台再 302 跳过去（这一步不进浏览器历史，后退直接回首页）；新建片子也走它。
   8. 左上角是 IP 切换菜单（2026-11-24 用户定）：点开列出所有 IP（当前的打 ✓），点一个就看那个 IP 的片子；最下面“新建 IP…”只填名字，建好自动切过去。
      “删除 IP…”（2026-11-25 用户要）：选一个 IP（默认 IP 不在里面），配置挪到回收站、能撤销；它的片子文件夹不动。
      “回收站…”（2026-11-25 用户要）：列出删掉的片子和 IP，点“还原”放回原处（片子回它那个 IP 的文件夹）；不做永久删除。
      选的 IP 记在服务那边（profiles/本机.json 的 "首页IP"），不靠浏览器。页面标题（Mac 窗口标题）是“IP 名 · ThinkCut”。用 --root 打开的首页只显示 IP 名、不能切。
   颜色是三块共用的苹果 macOS 配色（变量名和值见共享约定 C2_配色和约定，审片台、外壳一样）。 */
/* 颜色、线、圆角、阴影、字号、动效全部取自界面规格 design/tokens.css（2026-11-26 界面精修），这里不写死。 */
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{display:flex;flex-direction:column;background:var(--win);color:var(--t1);font-family:var(--font);font-size:var(--fs-13);line-height:var(--lh-13);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}input{-webkit-user-select:text;user-select:text}
.tbtn{height:28px;border-radius:var(--r-m);border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:0 var(--sp-2);cursor:default;white-space:nowrap;color:var(--t1);transition:background-color var(--dur-1) var(--ease)}
.tbtn:hover:not(:disabled){background:var(--fill)}.tbtn:active:not(:disabled){background:var(--fill-h)}
.tbtn.primary{background:var(--blue);color:var(--on-blue);font-weight:var(--fw-b);padding:0 var(--sp-3);box-shadow:0 1px 1px var(--fill-h)}.tbtn.primary:hover:not(:disabled){background:var(--blue-h)}.tbtn.primary:active:not(:disabled){background:var(--blue-p)}
.tbtn.plain{background:var(--btn);box-shadow:var(--sh-btn);padding:0 var(--sp-4);font-weight:var(--fw-b)}.tbtn.plain:hover:not(:disabled){background:var(--btn);background-image:linear-gradient(var(--fill),var(--fill))}
.tbtn.danger{background:var(--s-err);color:var(--on-blue);font-weight:var(--fw-b);padding:0 var(--sp-4)}.tbtn.danger:hover:not(:disabled){background:var(--s-err);filter:brightness(1.06)}
.tbtn.icon{width:24px;height:24px;padding:0;justify-content:center;color:var(--t3);border-radius:var(--r-s)}
button:disabled{opacity:.45}button:focus-visible,.card:focus-visible,tr:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.muted{color:var(--t3)}.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 7px;border-radius:var(--r-pill);font-size:var(--fs-12);font-weight:var(--fw-b);white-space:nowrap}
.pill.st-wait::before,.pill.st-todo::before,.pill.st-ai::before{content:"";width:6px;height:6px;border-radius:var(--r-pill);background:currentColor}
.st-wait{color:var(--s-wait-t);background:var(--s-wait-bg)}.st-wait::before{background:var(--s-wait)!important}
.st-todo{color:var(--s-todo-t);background:var(--s-todo-bg)}.st-todo::before{background:var(--s-todo)!important}
.st-ai{color:var(--s-ai-t);background:var(--s-ai-bg)}.st-ai::before{background:var(--s-ai)!important}
.st-ok{color:var(--s-ok-t);background:var(--s-ok-bg)}
.live{display:inline-block;width:6px;height:6px;border-radius:var(--r-pill);background:var(--s-ok);margin-left:6px;flex:none}
/* 工具栏 */
.toolbar{height:var(--bar-h);flex:0 0 var(--bar-h);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);background:var(--bar);border-bottom:var(--hairline);white-space:nowrap;min-width:0}
.toolbar h1{font-size:var(--fs-15);font-weight:var(--fw-b);margin:0}
/* IP 切换（左上角，像 Mac 工具栏的弹出按钮） */
.ipsum{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 8px;border-radius:var(--r-m);font-size:var(--fs-13);font-weight:var(--fw-b);max-width:260px;transition:background-color var(--dur-1) var(--ease)}
.ipsum:hover{background:var(--fill)}.ipsum span{overflow:hidden;text-overflow:ellipsis}.ipsum svg{flex:none;color:var(--t3)}
.ipsum .app{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--t3);flex:none}
.pop-body.ipmenu{left:0;right:auto;width:272px;padding:5px;border-radius:var(--r-m)}
.ipmenu .cap{font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--t3);padding:4px 10px 2px}
.ipmenu button{display:flex;width:100%;height:24px;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:var(--r-s);background:none;text-align:left;cursor:default}
.ipmenu button:hover,.ipmenu button:focus{background:var(--blue);color:var(--on-blue);outline:none}.ipmenu .ck{width:14px;flex:none;color:var(--blue);font-weight:var(--fw-b)}.ipmenu button:hover .ck{color:var(--on-blue)}
.ipmenu button span:not(.ck){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ipmenu hr{border:0;height:var(--hair-w);background:var(--hair);margin:4px 10px}.ipmenu .note{font-size:var(--fs-11);line-height:var(--lh-11);color:var(--t3);padding:2px 10px 6px 30px}.ipmenu .red{color:var(--s-err-t)}
.binlist{max-height:46vh;overflow:auto;margin:var(--sp-2) 0 var(--sp-1);border-radius:var(--r-m);background:var(--card);box-shadow:var(--sh-card)}
.binlist .g{font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--t3);padding:8px 12px 4px}.binlist .it{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:var(--hairline)}
.binlist .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--fw-b)}.binlist .it .w{font-size:var(--fs-11);color:var(--t3);white-space:nowrap}
.binlist .it .tbtn{height:24px;padding:0 10px}.binlist .none{padding:18px 12px;text-align:center;color:var(--t3)}
select.field{-webkit-appearance:none;appearance:none;padding-right:28px}
.selwrap{position:relative}.selwrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid var(--t3);border-bottom:1.5px solid var(--t3);transform:rotate(45deg);pointer-events:none}
/* 程序名（2026-11-25 用户：“这里应该有应用名字 thinkcut 思刻”）：像 Mac 应用标题，IP 菜单在它右边，中间细分隔；窄窗口只留 ThinkCut */
.appname{display:flex;align-items:baseline;gap:6px;font-size:var(--fs-15);font-weight:var(--fw-b);letter-spacing:-.01em;flex:none;color:var(--t1)}.appname .cn{font-size:var(--fs-12);font-weight:var(--fw-r);color:var(--t3)}
.tsep{width:var(--hair-w);height:16px;background:var(--hair2);flex:none}
/* 顶栏让位（规矩见 design/README.md 第 15 条）：按顶栏自己的宽度（对话侧栏打开时跟着变窄）判断。
   先让：合计数 → AI 状态收成小圆点 → “思刻”两个字 → “对话”只留图标、“设置”收成图标 → IP 名截短 → 程序名。看板/列表、新建项目、对话一直在。 */
.toolbar{container:tb/inline-size}
@container tb (max-width:1000px){.toolbar #sum{display:none}}
@container tb (max-width:860px){.toolbar #aiword{display:none}.toolbar .aisum{padding:0 7px}.appname .cn{display:none}}
@container tb (max-width:720px){.toolbar{gap:var(--sp-2)}.toolbar .ipsum{max-width:140px}#setbtn .sl{display:none}}
@container tb (max-width:560px){.appname,.tsep{display:none}.toolbar .ipsum{max-width:96px}#newbtn .nl{display:none}}
@container tb (max-width:720px){#tcChatBtn .tc-l,#tcChatBtn kbd{display:none}}
html.cutdesk-app .toolbar{padding-left:92px}   /* 在 Mac 外壳里：左边给窗口三颗灯留够空（C2 用户嫌太近）；拖窗口外壳来做 */
.sum{font-size:var(--fs-12);color:var(--t3);overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;gap:var(--sp-1)}
.sum b{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 var(--sp-2);border-radius:var(--r-s);font-weight:var(--fw-b)}.sum b::before{content:"";width:6px;height:6px;border-radius:var(--r-pill);background:currentColor}
.sum b.t{color:var(--s-wait-t)}.sum b.t::before{background:var(--s-wait)}.sum b.a{color:var(--s-ai-t)}.sum b.a::before{background:var(--s-ai)}
.seg{display:flex;background:var(--seg);border-radius:var(--r-m);padding:2px;gap:2px;flex:none}.seg .tbtn{height:24px;padding:0 var(--sp-3);border-radius:var(--r-s);color:var(--t2)}.seg .tbtn:hover{background:var(--fill)}
.seg .tbtn[aria-pressed="true"],.seg .tbtn[aria-pressed="true"]:hover{background:var(--seg-on);color:var(--t1);font-weight:var(--fw-b);box-shadow:var(--seg-on-sh)}
.pop{position:relative;flex:0 0 auto}.pop>summary{list-style:none}.pop>summary::-webkit-details-marker{display:none}
.pop-body{position:absolute;right:0;top:36px;width:400px;max-width:calc(100vw - 32px);background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-pop);padding:var(--sp-4);z-index:20;white-space:normal;-webkit-user-select:text;user-select:text;animation:popin var(--dur-2) var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(calc(4px * var(--move))) scale(calc(1 - .02 * var(--move)))}}
.pop-body h3{font-size:var(--fs-13);font-weight:var(--fw-b);margin:0 0 6px}.pop-body p{margin:0 0 var(--sp-2)}.pop-body code{display:block;background:var(--sunk);border-radius:var(--r-s);padding:6px 9px;font-family:var(--font-mono);font-size:var(--fs-11);word-break:break-all;margin:4px 0 8px;user-select:all;box-shadow:inset 0 0 0 var(--hair-w) var(--hair)}
.aisum{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);height:24px;padding:0 var(--sp-2);border-radius:var(--r-s);color:var(--t2);transition:background-color var(--dur-1) var(--ease)}.aisum:hover,.pop[open]>.aisum{background:var(--fill)}
.dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--s-off);flex:none}.dot.on{background:var(--s-ok)}.dot.off{background:var(--s-off)}.dot.ai{background:var(--s-ai)}.dot.err{background:var(--s-err)}
.field{display:block;width:100%;border:0;border-radius:var(--r-s);background:var(--card);padding:6px 10px;margin:6px 0 12px;box-shadow:var(--sh-btn);outline:none;transition:box-shadow var(--dur-1) var(--ease)}.field:focus{box-shadow:0 0 0 1px var(--blue),0 0 0 4px var(--ring)}
.row{display:flex;align-items:center;gap:var(--sp-2)}
/* 首页“?”：怎么用（2026-11-26 用户：底部说明太啰嗦，挪进帮助） */
.help p{margin:0 0 var(--sp-2);font-size:var(--fs-12);line-height:19px;color:var(--t2)}.help p b{color:var(--t1)}.help kbd{font-family:inherit;font-size:var(--fs-11);padding:0 5px;border-radius:var(--r-s);background:var(--fill);box-shadow:inset 0 -.5px 0 var(--hair2);color:var(--t1)}
.pk{margin:-8px}.pkh{display:flex;align-items:baseline;justify-content:space-between;padding:6px 10px 8px}
.pk .eng{display:grid;grid-template-columns:20px 110px auto minmax(0,1fr) auto;align-items:center;gap:var(--sp-2);min-height:44px;padding:6px 10px;border-radius:var(--r-m);transition:background-color var(--dur-1) var(--ease)}
.pk .eng.on{background:var(--blue-tint)}.pk .eng.can:hover{background:var(--fill)}.pk .eng .ck{color:var(--blue);font-weight:var(--fw-b);text-align:center}
.pk .eng .why{font-size:var(--fs-11);color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pk .eng .pill{height:18px}
.pk .note{font-size:var(--fs-11);line-height:var(--lh-11);margin:var(--sp-2) 10px 0;padding-top:var(--sp-2);border-top:var(--hairline)}.pkf{display:flex;justify-content:flex-end;padding:var(--sp-2) 10px 2px}
.st-wait.pill::before{content:none}
/* 看板 */
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4);padding:14px var(--sp-5) var(--sp-5);align-items:start;min-width:760px;flex:1 0 auto}
.colh{display:flex;align-items:center;gap:var(--sp-2);height:28px;font-size:var(--fs-13);font-weight:var(--fw-b);padding:0 var(--sp-1);margin-bottom:var(--sp-3)}.colh .c{color:var(--t3);font-weight:var(--fw-r);font-size:var(--fs-12)}
.num{width:18px;height:18px;border-radius:var(--r-pill);background:var(--fill-h);color:var(--t2);font-size:var(--fs-11);font-weight:var(--fw-b);display:inline-flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.card{background:var(--card);border-radius:var(--r-l);box-shadow:var(--sh-card);overflow:hidden;display:flex;flex-direction:column;cursor:default;transition:box-shadow var(--dur-1) var(--ease)}
.card:hover{box-shadow:0 0 0 var(--hair-w) var(--hair),var(--sh2)}.card.sel{box-shadow:0 0 0 2px var(--blue),var(--sh1)}
.card.last{box-shadow:0 0 0 2px var(--blue),var(--sh2)}.thumb{position:relative}.lastpill{position:absolute;right:10px;top:10px;background:var(--card);color:var(--t2);box-shadow:var(--sh-btn)}
.thumb{height:150px;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:var(--fs-12);overflow:hidden;border-bottom:var(--hairline)}
.nocov{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--t3)}.nocov svg{color:var(--t4)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;-webkit-user-drag:none}
.cb{padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.ct{font-weight:var(--fw-b);display:flex;align-items:center;min-width:0}.ct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct .n{color:var(--t3);font-weight:var(--fw-r);font-size:var(--fs-12);flex:none;margin-right:var(--sp-2)}
.cn{font-size:var(--fs-12);line-height:var(--lh-12);color:var(--t3)}.cf{display:flex;gap:6px;align-items:center;min-height:20px;margin-top:var(--sp-1)}.cf .w{margin-left:auto;font-size:var(--fs-11);color:var(--t3)}

/* 列表 */
.table{width:100%;border-collapse:collapse;background:var(--surface);min-width:760px}
.table th{font-size:var(--fs-11);font-weight:var(--fw-b);color:var(--t3);padding:6px var(--sp-5);border-bottom:var(--hairline);text-align:left;position:sticky;top:0;background:var(--bar);white-space:nowrap;z-index:1}

.menu{position:fixed;z-index:60;min-width:228px;background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-pop);padding:5px;animation:popin var(--dur-1) var(--ease)}

.menu button:hover,.menu button:focus{background:var(--blue);color:var(--on-blue);outline:none}.menu button:hover .k,.menu button:focus .k{color:var(--on-blue)}

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN='__SHENPIAN_TOKEN__';
const human=s=>{s=String(s??'').trim();return !s?'操作没有完成，请重试':/Errno|Traceback|Exception|[A-Za-z]+Error\b|Expecting (property|value)|Failed to fetch|NetworkError|Load failed|Unexpected token/.test(s)||!/[\u4e00-\u9fa5]/.test(s)?'服务处理出错（技术细节已记入日志），请稍后重试':s};
async function req(p,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(p,{...o,signal:c.signal});
    if(r.status===403&&o?.method==='POST'&&!o.again){await fetch('/',{cache:'no-store'}).catch(()=>{});return req(p,{...o,again:true})}   // 首页服务重启过、cookie 旧了：取一次页面换新 cookie 再发
    if(r.status===403&&o?.method==='POST'){location.reload();return {ok:false,error:'首页服务已重启，正在刷新页面…'}}
    const x=await r.text();try{return JSON.parse(x)}catch{return {ok:false,error:`首页服务出错（${r.status}）`}}}finally{clearTimeout(t)}}
const get=p=>req(p);
let IP='',IPS=null;   // 页面正在看的 IP（服务那边说了算；每个请求带上，首页被别处切走了就不动）
const post=(p,b)=>req(p,{method:'POST',headers:{'Content-Type':'application/json','X-Shenpian-Token':TOKEN},body:JSON.stringify({...(IP?{ip:IP}:{}),...(b||{})})}).then(r=>{if(r&&r.ok===false)r.error=human(r.error);return r},()=>({ok:false,error:'连不上首页服务：请稍后重试，或重新打开 ThinkCut'}));
const BUSY=new Set();
async function guard(key,btn,fn){if(BUSY.has(key))return {ok:false,busy:true};BUSY.add(key);if(btn){btn.disabled=true;btn.classList.add('busy')}
  try{return await fn()}finally{BUSY.delete(key);if(btn&&btn.isConnected){btn.disabled=false;btn.classList.remove('busy')}}}
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let toastT;function say(s,err,undo){const t=$('toast');t.innerHTML='<span>'+esc(s)+'</span>'+(undo?'<button id="undo">撤销</button>':'');t.className='show'+(err?' err':'');
  if(undo)$('undo').onclick=()=>{t.className='';undo()};clearTimeout(toastT);toastT=setTimeout(()=>t.className='',undo?15000:err?7000:2400)}
const UST={'待你看':'wait','待发送':'todo','AI 在改':'ai','已定':'ok'};
// 页面上的叫法（2026-11-24 用户定“第一次看就懂”，和审片台一样）；数据里的状态名不变
const SN={'待你看':'待审阅','待发送':'待提交','AI 在改':'AI 处理中','已定':'✓ 已定稿'};
const pill=(s,n)=>s?`<span class="pill st-${UST[s]}">${esc(SN[s]||s)}${n?' '+n:''}</span>`:'';
const when=t=>{if(!t)return'';const d=new Date(t*1000),n=new Date(),p=x=>String(x).padStart(2,'0');
  return d.toDateString()===n.toDateString()?`今天 ${p(d.getHours())}:${p(d.getMinutes())}`:`${d.getMonth()+1}月${d.getDate()}日`};
const STEPS=['撰稿','初剪','精修','发布'];
const OLDSTEP={写文案:'撰稿',出初稿:'初剪',改初稿:'精修'};   // 旧版首页服务发来的阶段名
const EMPTY={撰稿:'点右上“＋ 新建项目”开始撰稿',初剪:'文稿定稿并开始制作后，由 AI 完成初剪',精修:'初剪完成后在此审阅、提意见',发布:'审片定稿后在此导出、存入草稿'};
// —— 浮层：点外面空白处关、Esc 关（确认框例外：只能点按钮或 Esc） ——
document.addEventListener('pointerdown',e=>{for(const el of document.querySelectorAll('.ovl'))if(el.open&&!el.contains(e.target))el.open=false;if(!$('menu').contains(e.target))hideMenu()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('sheet').hidden)return closeSheet();hideMenu();document.querySelectorAll('.ovl').forEach(el=>el.open=false)});
// —— 数据：先出名字，每条的阶段、封面、轮到你／AI 在改并发补齐 ——
let FILMS=[],ST={},AI={},SEL=null,VIEW=store.get('cutdesk-home-view')==='list'?'list':'board',DONE_OPEN=false,loaded=false,EMPTY_MSG='';
const film=id=>FILMS.find(f=>f.id===id);
function where(f){if(f.done)return{col:'发布',tag:'已定',note:'已完成'};const st=ST[f.id]?.stages;if(!st)return{col:'撰稿',note:'…'};
  if(st.every(x=>x.state==='done'))return{col:'发布',tag:'已定',note:'已存入草稿；发布后可右键移到“已完成”'};
  const x=st.filter(x=>x.state==='now').pop()||st[0];return{col:OLDSTEP[x.name]||x.name,tag:x.tag,note:x.note}}
const count=(f,tag)=>{const s=ST[f.id];if(!s||!tag||tag==='已定')return 0;return tag==='AI 在改'?s.ai:s.turn};
const listening=f=>AI.films?.includes(f.id)||(AI.all&&ST[f.id]?.open);
const title=(f,row)=>`<span class="n">${esc(f.num)}</span><span>${esc(f.title)}</span>${listening(f)?'<i class="live" title="AI 在线（本项目）"></i>':''}${row&&LAST===f.id?'<span class="pill lastpill" style="position:static;margin-left:8px">上次开的</span>':''}`;
function card(f){const s=ST[f.id],w=where(f);
  const th=s?.cover?`<img alt="" src="/api/cover?id=${encodeURIComponent(f.id)}&v=${s.cover}">`:'<span class="nocov"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.75" cy="6.25" r="1.1"/><path d="m2.5 12 3.75-3.5 2.5 2.25 2-1.75L14 12"/></svg>暂无封面</span>';
  const foot=s?.ok===false?`<span class="err">${esc(s.error)}</span>`:pill(w.tag,count(f,w.tag));
  return `<div class="card${SEL===f.id?' sel':''}${LAST===f.id?' last':''}" tabindex="0" data-id="${esc(f.id)}"><div class="thumb">${th}${LAST===f.id?'<span class="pill lastpill">上次开的</span>':''}</div><div class="cb"><div class="ct">${title(f)}</div>
<div class="cn">${esc(w.note||'')}</div><div class="cf">${foot}<span class="w">${esc(when(s?.t||f.t))}</span></div></div></div>`}
function drawBoard(){const doing=FILMS.filter(f=>!f.done),done=FILMS.filter(f=>f.done);
  const cols=Object.fromEntries(STEPS.map(n=>[n,[]]));for(const f of doing)(cols[where(f).col]||cols['撰稿']).push(f);
  let h='<div class="board">'+STEPS.map((n,i)=>`<section class="col" aria-label="${n}"><div class="colh"><span class="num">${i+1}</span>${n}<span class="c">${cols[n].length}</span></div>${cols[n].length?cols[n].map(card).join(''):`<div class="empty">${EMPTY[n]}</div>`}</section>`).join('')+'</div>';
  if(done.length)h+=`<div class="done"><div class="done-h"><b>已完成</b><span class="muted">${done.length}</span>${DONE_OPEN?'':`<span style="color:var(--s-ok)">✓</span><span class="first">${esc(done[0].num+'　'+done[0].title)}${done.length>1?`　等 ${done.length} 条`:''}</span>`}<button class="link" id="doneT">${DONE_OPEN?'收起':'全部展开'}</button></div>${DONE_OPEN?`<div class="done-grid">${done.map(card).join('')}</div>`:''}</div>`;
  return h}
function trow(f){const s=ST[f.id],w=where(f),st=s?.stages||STEPS.map(n=>({name:n,state:f.done?'done':'todo'}));
  const steps=st.map((x,i)=>`${i?'<i>→</i>':''}<span class="s-${x.state}">${x.state==='done'?'✓':''}${esc(OLDSTEP[x.name]||x.name)}</span>`).join('');
  const ok=s&&s.ok!==false,c=ok?`<span style="${s.turn?'color:var(--s-wait);font-weight:600':''}">${s.turn}</span>`:'',a=ok?`<span style="${s.ai?'color:var(--s-ai);font-weight:600':''}">${s.ai}</span>`:'';
  return `<tr class="film${SEL===f.id?' sel':''}" tabindex="0" data-id="${esc(f.id)}"><td class="nm"><div>${title(f,1)}</div><div class="sub">${s?.ok===false?`<span class="err">${esc(s.error)}</span>`:esc(w.note||'')}</div></td>
<td><div class="steps">${steps}</div></td><td>${pill(w.tag)}</td><td>${c}</td><td>${a}</td><td class="muted">${esc(when(s?.t||f.t))}</td></tr>`}
function drawList(){const doing=FILMS.filter(f=>!f.done),done=FILMS.filter(f=>f.done);
  return `<table class="table"><thead><tr><th>项目名</th><th>阶段</th><th>状态</th><th>待审阅</th><th>AI 处理中</th><th>修改时间</th></tr></thead><tbody>${doing.map(trow).join('')}
${done.length?`<tr class="grp"><td colspan="6">已完成 · ${done.length}<button class="link" id="doneT" style="margin-left:10px">${DONE_OPEN?'收起':'全部展开'}</button></td></tr>${DONE_OPEN?done.map(trow).join(''):''}`:''}</tbody></table>`}
function draw(){if(!loaded||!$('menu').hidden)return;const m=$('main'),y=m.scrollTop;
  m.innerHTML=!FILMS.length?`<p class="blank">${esc(EMPTY_MSG)}</p>`:VIEW==='list'?drawList():drawBoard();m.scrollTop=y;
  if($('doneT'))$('doneT').onclick=e=>{e.stopPropagation();DONE_OPEN=!DONE_OPEN;draw();if(DONE_OPEN)fill(FILMS.filter(f=>f.done&&!ST[f.id]))};
  const tt=FILMS.filter(f=>!f.done).reduce((a,f)=>[a[0]+(ST[f.id]?.turn||0),a[1]+(ST[f.id]?.ai||0)],[0,0]);
  $('sum').innerHTML=(tt[0]?`<b class="t">待审阅 ${tt[0]}</b>`:'')+(tt[1]?`<b class="a">AI 处理中 ${tt[1]}</b>`:'')}
async function fill(list){const q=[...list];await Promise.all(Array.from({length:4},async()=>{while(q.length){const f=q.shift();const s=await get('/api/film?id='+encodeURIComponent(f.id)).catch(()=>null);if(s)ST[f.id]=s}}));draw()}
let filling=false;
let FAILS=0;
function offline(on){const b=$('netbar');if(!on){FAILS=0;b.hidden=true;return}b.hidden=false;
  b.innerHTML='<span>连不上首页服务：可能已停止，或存放项目的磁盘（NAS）暂时无法访问。</span><button class="tbtn plain" id="nbRetry">重新连接</button>';
  $('nbRetry').onclick=async e=>{e.target.disabled=true;e.target.textContent='正在连接…';await refresh().catch(()=>{});ai().catch(()=>{})};
  $('aidot').className='dot';$('aiword').textContent='AI …';if(!loaded){$('main').innerHTML='<p class="blank">无法读取项目列表</p>'}}
async function refresh(){if(filling)return;filling=true;try{if(!await fresh())return;
  const r=await get('/api/films');if(!r||!Array.isArray(r.films))throw new Error('bad');offline(false);if(r.ip&&r.ip!==IP){setIP(r.ip);ST={};SEL=null}FILMS=r.films;
  EMPTY_MSG=r.exists===false?(r.pinned?'存放项目的文件夹不存在：请让 AI 检查首页的 --root 设置':`「${IP}」的项目文件夹不存在或磁盘（NAS）无法访问：请检查后点“重新连接”`):`「${IP}」还没有项目：点右上“＋ 新建项目”`;
  await fill(FILMS.filter(f=>!f.done||DONE_OPEN));loaded=true;draw()}
  catch(e){if(++FAILS>=1)offline(true);throw e}finally{filling=false}}
function setView(v){VIEW=v;store.set('cutdesk-home-view',v);$('v-board').setAttribute('aria-pressed',v==='board');$('v-list').setAttribute('aria-pressed',v==='list');draw()}
$('v-board').onclick=()=>setView('board');$('v-list').onclick=()=>setView('list');setView(VIEW);
// —— AI 在不在等（3 秒问一次） ——
async function ai(){const a=await get('/api/ai').catch(()=>null);if(!a||!a.films){$('aidot').className='dot';$('aiword').textContent='AI …';return}const was=JSON.stringify([AI.all,AI.films]);AI=a;
  const n=a.films.length,e=a.engine||{},up=e.state==='在线';$('aidot').className='dot '+(AIDOT[e.state]||(a.all||n?'on':'off'));
  $('aiword').textContent=e.name?`${e.name} · ${e.state}`:a.all?'AI 在线':n?`AI 在线 · ${n} 个项目`:'AI 离线';$('aiword').parentNode.title=$('aiword').textContent+'：点开看详情、换 AI';
  if(!$('aipop').open)aiPick();
  if(JSON.stringify([a.all,a.films])!==was)draw()}
// —— 点右上角 AI 状态：直接列出这台 Mac 上的 AI，点一下就换（2026-11-26 用户：“我一点就能自动切换到那个 AI”）；更多设置在设置页 ——
const AIDOT={'在线':'on','处理中':'ai','未装':'off','未登录':'off','出错':'err'};
async function aiPick(){const r=await get('/api/settings').catch(()=>null);const box=$('aibody');if(!box)return;
  if(!r||!r.engines){box.innerHTML='<h3>AI</h3><p class="muted">读不到 AI 设置，稍后再试。</p>';return}
  const rows=r.engines.map(e=>{const on=r.engine===e.id,can=e.installed&&e.logged_in;
    const tag=e.state==='在线'?(on?'在线':'已登录'):e.state;
    return `<div class="eng${on?' on':''}${can&&!on?' can':''}" data-eng="${esc(e.id)}"><span class="ck">${on?'✓':''}</span><b>${esc(e.name)}</b><span class="pill ${{'在线':'st-ok','处理中':'st-ai','未登录':'st-todo','出错':'st-wait'}[e.state]||''}">${esc(tag)}</span><span class="why">${esc(on?'正在用 · 所有项目默认用它':can?'点一下换成它':(e.why||''))}</span>${e.installed&&!e.logged_in?`<button class="tbtn plain" data-login="${esc(e.id)}">登录</button>`:''}</div>`}).join('');
  box.innerHTML=`<div class="pk"><div class="pkh"><b>用哪个 AI 处理</b><span class="muted">点一下就换</span></div>${rows}<p class="muted note">在首页换，是换所有项目默认用的 AI；换了以后项目在新 AI 里接着做，项目文件和之前的意见都在。AI 没在线时点“提交 AI”先存下，上线后自动开始。</p><div class="pkf"><button class="link" id="goSet2">更多设置（模型、豆包、蚁小二）›</button></div></div>`;
